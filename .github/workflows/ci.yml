name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['20.19', '22', '24']
        include:
          # One Windows run catches shebang and path-separator problems.
          - os: windows-latest
            node: '24'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The unit suite is offline by design: OASA is frequently unavailable and
      # must never be able to turn a build red.
      - run: npm test
      - run: npm run build
      - name: Verify the published tarball actually runs
        shell: bash
        run: |
          set -euo pipefail
          npm pack --silent
          tarball="$(ls oasa-mcp-*.tgz)"
          work="$(mktemp -d)"
          cd "$work"
          npm init -y --silent > /dev/null
          # Installing the real tarball proves `files`, `bin` and the shebang
          # together — a passing test suite does not.
          npm install --silent "$GITHUB_WORKSPACE/$tarball"
          ./node_modules/.bin/oasa-mcp --version
          ./node_modules/.bin/oasa-mcp --help
